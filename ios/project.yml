# XcodeGen 스펙 — ios/Shim.xcodeproj 의 선언적 정의
#
# 용도 (docs/DECISIONS.md D-006):
#   커밋된 Shim.xcodeproj/project.pbxproj 는 Xcode 없이 수기로 작성했다.
#   Xcode 15 이하에서 열리지 않거나 프로젝트 파일이 손상된 경우 이 스펙으로 재생성한다.
#
#   $ brew install xcodegen
#   $ cd ios && xcodegen generate
#
# 두 정의는 항상 같은 구성을 유지해야 한다. 한쪽을 바꾸면 다른 쪽도 갱신한다.

name: Shim

options:
  bundleIdPrefix: com.shimapp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # 서명 정보는 저장소에 커밋하지 않는다 (docs/DECISIONS.md D-004).
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  Shim:
    type: application
    platform: iOS
    sources:
      - path: Shim
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimapp.Shim
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1"          # iPhone 전용
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # 쉼은 어두운 최소 화면을 기본으로 한다 (docs/IOS_SPEC.md 8.2).
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        # Background Audio (Sprint 3, D-017).
        # .playback 세션과 함께 있어야 앱이 background 로 가거나 화면이
        # 잠겨도 재생이 이어진다. 실제 동작은 실기기에서만 검증 가능하다.
        INFOPLIST_KEY_UIBackgroundModes: audio

  ShimTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ShimTests
    dependencies:
      - target: Shim
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimapp.ShimTests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  Shim:
    build:
      targets:
        Shim: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ShimTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
